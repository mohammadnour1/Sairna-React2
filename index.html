<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="سيرنا — احجز رحلتك بالباص بين المحافظات السورية بخطوات بسيطة." />
    <meta name="theme-color" content="#0d3043" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>سيرنا | الرحلة بتبلّش من هون</title>
    <script>
      // Apply the saved theme before React mounts so there is no light/dark flash.
      try {
        var t = localStorage.getItem('sairna-theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
        else document.documentElement.dataset.theme = 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 60px; text-align: center; font-family: sans-serif">يلزم تفعيل JavaScript لتشغيل العرض التفاعلي.</div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
