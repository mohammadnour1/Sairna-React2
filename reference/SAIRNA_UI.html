/* SAIRNA / سيرنا — responsive Arabic RTL design system */
:root {
  color-scheme:light;
  --bg:#f8fafb;
  --surface:#fff;
  --surface-alt:#f2f7f8;
  --text:#112f41;
  --muted:#718493;
  --border:#e4ecef;
  --primary:#0aa99b;
  --primary-deep:#078e87;
  --dark:#103a4e;
  --dark-deep:#0a2c3e;
  --soft-teal:#e6f8f3;
  --shadow:0 15px 55px rgba(19,54,72,.065);
  --shadow-md:0 22px 60px rgba(19,54,72,.11);
  --radius:22px;
  --container:1216px;
  --font:Cairo,"Segoe UI",Tahoma,sans-serif
}
:root[data-theme=dark] {
  color-scheme:dark;
  --bg:#0b1c29;
  --surface:#112b3b;
  --surface-alt:#173748;
  --text:#eef8fa;
  --muted:#9eb3be;
  --border:#254252;
  --dark:#0e2634;
  --dark-deep:#091c27;
  --soft-teal:#174b49;
  --shadow:0 15px 55px rgba(0,0,0,.16);
  --shadow-md:0 22px 60px rgba(0,0,0,.26)
}
* {
  box-sizing:border-box
}
html {
  scroll-behavior:smooth
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased
}
button,input,select,textarea {
  font:inherit
}
button {
  cursor:pointer
}
a {
  color:inherit;
  text-decoration:none
}
img,svg {
  vertical-align:middle
}
img {
  max-width:100%
}
button,input,select {
  outline-offset:3px
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible {
  outline:3px solid #4cc8bf;
  outline-offset:3px
}
h1,h2,h3,h4,p {
  margin-top:0
}
h1,h2,h3,h4 {
  line-height:1.5;
  font-weight:800
}
p {
  color:var(--muted)
}
.container {
  width:min(var(--container),calc(100% - 68px));
  margin-inline:auto
}
.app-root {
  overflow:hidden
}
.full {
  width:100%
}
.section {
  padding:86px 0
}
.small-muted {
  font-size:12px;
  color:var(--muted)
}
.muted {
  color:var(--muted)
}
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  border:1px solid transparent;
  border-radius:12px;
  min-height:49px;
  padding:11px 22px;
  font-weight:800;
  font-size:13px;
  white-space:nowrap;
  transition:transform .25s ease,box-shadow .25s ease,background .25s ease,border .25s ease
}
.btn:hover {
  transform:translateY(-3px)
}
.btn:active {
  transform:translateY(0) scale(.98)
}
.btn-primary {
  background:var(--primary);
  color:white;
  box-shadow:0 9px 20px rgba(8,165,151,.19)
}
.btn-primary:hover {
  background:var(--primary-deep);
  box-shadow:0 12px 25px rgba(8,165,151,.28)
}
.btn-dark {
  background:var(--dark);
  color:white
}
.btn-dark:hover {
  background:#174d61
}
.btn-sm {
  min-height:40px;
  padding:8px 15px;
  font-size:12px;
  border-radius:10px
}
.btn-outline {
  color:var(--text);
  background:var(--surface);
  border-color:var(--border)
}
.btn-outline:hover {
  border-color:var(--primary);
  color:var(--primary)
}
.btn-subtle {
  background:var(--surface-alt);
  color:var(--text)
}
.btn-white {
  background:#fff;
  color:#114054
}
.btn-white:hover {
  background:#e7fff9
}
.quiet-button {
  background:none;
  border:0;
  color:var(--primary);
  font-size:12px;
  font-weight:800
}
.quiet-back {
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-weight:700
}
.quiet-back:hover {
  color:var(--primary)
}
.icon-button {
  display:inline-grid;
  place-items:center;
  flex:none;
  border:1px solid var(--border);
  border-radius:12px;
  width:40px;
  height:40px;
  color:var(--text);
  background:var(--surface);
  transition:.25s
}
.icon-button:hover {
  background:var(--soft-teal);
  color:var(--primary);
  border-color:var(--primary)
}
.announcement {
  min-height:32px;
  background:var(--dark-deep);
  color:#d4f2ec;
  font-size:10px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  letter-spacing:.1px
}
.announcement-dot {
  width:6px;
  height:6px;
  background:#58d7bb;
  border-radius:50%;
  box-shadow:0 0 0 4px rgba(88,215,187,.12)
}
.ann-star {
  color:#ffce87
}
.site-header {
  position:sticky;
  top:0;
  z-index:80;
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px)
}
.header-inner {
  height:83px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:22px
}
.brand {
  display:inline-flex;
  align-items:center;
  gap:10px;
  flex-shrink:0
}
.brand-icon {
  width:48px;
  height:48px;
  display:grid;
  place-items:center
}
.brand-icon img {
  width:100%;
  height:100%
}
.brand-text {
  display:flex;
  flex-direction:column;
  line-height:1.2
}
.brand-text strong {
  font-size:30px;
  letter-spacing:-1.5px;
  font-weight:900;
  color:var(--dark-deep)
}
[data-theme=dark] .brand-text strong {
  color:var(--text)
}
.brand-dot {
  color:var(--primary)
}
.brand-text small {
  font-size:9px;
  font-weight:700;
  margin-top:7px;
  color:var(--muted);
  white-space:nowrap
}
.desktop-nav {
  display:flex;
  align-items:center;
  gap:27px;
  margin-inline:auto
}
.nav-link {
  font-size:12px;
  color:var(--muted);
  font-weight:800;
  position:relative;
  white-space:nowrap;
  padding:32px 0
}
.nav-link::after {
  content:"";
  position:absolute;
  right:50%;
  bottom:17px;
  width:0;
  height:3px;
  border-radius:5px;
  background:var(--primary);
  transform:translateX(50%);
  transition:width .27s
}
.nav-link:hover,.nav-link.active {
  color:var(--text)
}
.nav-link.active::after,.nav-link:hover::after {
  width:23px
}
.header-actions {
  display:flex;
  align-items:center;
  gap:12px
}
.login-link {
  font-size:12px;
  font-weight:800;
  color:var(--text);
  white-space:nowrap
}
.login-link:hover {
  color:var(--primary)
}
.user-menu {
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  font-size:12px
}
.avatar {
  width:35px;
  height:35px;
  border-radius:50%;
  background:var(--soft-teal);
  color:var(--primary);
  display:grid;
  place-items:center;
  font-weight:900
}
.mobile-toggle,.mobile-panel {
  display:none
}
.mobile-panel {
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:12px 28px
}
.mobile-link {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 8px;
  font-weight:700;
  border-bottom:1px solid var(--border)
}
.mobile-link.active {
  color:var(--primary)
}
/* Hero */
.hero-section {
  background:linear-gradient(160deg,#f5fbfa 0%,#f8fbfc 56%,#f3f9f7 100%);
  padding:65px 0 71px;
  position:relative
}
[data-theme=dark] .hero-section {
  background:linear-gradient(160deg,#102f3d,var(--bg))
}
.hero-section:before {
  content:"";
  position:absolute;
  width:540px;
  height:540px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(76,203,175,.1),transparent 66%);
  top:-180px;
  left:-140px;
  pointer-events:none
}
.hero-grid {
  display:grid;
  grid-template-columns:.95fr 1.05fr;
  align-items:center;
  gap:36px;
  min-height:420px
}
.hero-copy {
  padding-bottom:34px;
  position:relative;
  z-index:1
}
.eyebrow {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--soft-teal);
  color:var(--primary-deep);
  border-radius:99px;
  padding:5px 14px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.12px
}
.mini-star {
  font-size:13px;
  color:var(--primary)
}
.hero-copy h1 {
  font-size:clamp(48px,5.15vw,79px);
  margin:19px 0 11px;
  letter-spacing:-2.4px;
  line-height:1.33;
  font-weight:900;
  color:var(--dark-deep)
}
[data-theme=dark] .hero-copy h1 {
  color:var(--text)
}
.gradient-text {
  background:linear-gradient(93deg,#078a91,#15ba9d 75%);
  color:transparent;
  background-clip:text;
  -webkit-background-clip:text
}
.hero-copy>p {
  font-size:16px;
  line-height:2.15;
  max-width:485px;
  margin-bottom:22px
}
.hero-points {
  display:flex;
  gap:20px;
  align-items:center;
  flex-wrap:wrap
}
.hero-points span {
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--text);
  font-weight:800;
  font-size:11px
}
.hero-points svg {
  color:var(--primary)
}
.hero-social-proof {
  display:flex;
  align-items:center;
  gap:14px;
  margin-top:40px
}
.proof-avatars {
  display:flex;
  flex-direction:row
}
.proof-avatars span {
  width:35px;
  height:35px;
  border:3px solid var(--surface);
  border-radius:50%;
  display:grid;
  place-items:center;
  margin-left:-7px;
  background:#f3d2a6;
  color:#5e3a36;
  font-weight:900
}
.proof-avatars span:nth-child(2) {
  background:#c2dadb
}
.proof-avatars span:nth-child(3) {
  background:#e4bed1
}
.proof-avatars span:nth-child(4) {
  background:#b9d2ed
}
.proof-stars {
  color:#f7b843;
  line-height:1.5;
  letter-spacing:1px;
  font-size:13px
}
.proof-stars b {
  color:var(--text);
  letter-spacing:0;
  margin-right:4px;
  font-size:12px
}
.hero-social-proof small {
  font-size:10px;
  color:var(--muted);
  font-weight:700
}
.hero-visual {
  position:relative;
  min-width:0;
  padding:18px 20px 18px 0
}
.hero-image-wrap {
  position:relative;
  border-radius:30px;
  background:#a8ddd2;
  box-shadow:0 30px 70px rgba(10,62,70,.15);
  transform:rotate(-1.5deg);
  overflow:visible
}
.hero-image-wrap>img {
  display:block;
  width:100%;
  border-radius:30px;
  aspect-ratio:1.45;
  object-fit:cover
}
.hero-orbit {
  position:absolute;
  border:1.5px dashed #99d6cc;
  border-radius:50%;
  z-index:-1
}
.orbit-a {
  width:220px;
  height:220px;
  left:-62px;
  top:-35px
}
.orbit-b {
  width:150px;
  height:150px;
  right:-50px;
  bottom:0
}
.floating-stat {
  position:absolute;
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  border-radius:16px;
  box-shadow:0 15px 28px rgba(15,61,69,.17);
  padding:12px 16px;
  /* Keep the card angle fixed while only the vertical position floats. */
  --float-distance:-5px;
  transform:translate3d(0,0,0) rotate(1.5deg);
  transform-origin:center;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  will-change:transform;
  pointer-events:none;
  color:#114252;
  animation:float 9s ease-in-out infinite
}
.floating-stat>svg {
  color:var(--primary)
}
.floating-stat div {
  display:flex;
  flex-direction:column;
  white-space:nowrap
}
.floating-stat b {
  font-size:12px
}
.floating-stat small {
  font-size:10px;
  color:#7e9299
}
.stat-top {
  top:36px;
  left:-26px
}
.stat-bottom {
  right:-22px;
  bottom:45px;
  --float-distance:-4px;
  animation-duration:10s;
  animation-delay:-4.5s
}
.floating-circle {
  background:#e6f9f4;
  color:#0ca88f;
  border-radius:12px;
  width:40px;
  height:40px;
  display:grid;
  place-items:center
}
.search-shell {
  position:relative;
  z-index:3;
  margin-top:22px;
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:0 21px 58px rgba(11,71,72,.1);
  border-radius:21px;
  padding:22px 24px 25px
}
.search-shell-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px
}
.search-shell-heading>div:first-child {
  display:flex;
  align-items:center;
  gap:11px
}
.search-shell-heading strong {
  font-size:15px
}
.search-shell-heading span:not(.search-small-dot) {
  font-size:11px;
  color:var(--muted)
}
.search-small-dot {
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--primary);
  box-shadow:0 0 0 5px var(--soft-teal)
}
.steps-tag {
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:#14968d;
  font-weight:800;
  font-size:10px
}
.search-form {
  display:grid;
  grid-template-columns:1.12fr 34px 1.12fr 1fr .74fr 1.14fr;
  gap:11px;
  align-items:end
}
.search-field {
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  height:60px;
  padding:11px 14px 5px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:11px;
  min-width:0;
  transition:border .2s,box-shadow .2s
}
.search-field:focus-within {
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(13,172,155,.08)
}
.search-field>svg {
  flex-shrink:0;
  color:var(--primary);
  margin-top:12px
}
.field-label {
  position:absolute;
  top:7px;
  right:14px;
  color:var(--muted);
  font-size:10px;
  font-weight:700
}
.search-field select,.search-field input {
  border:0;
  background:transparent;
  min-width:0;
  width:100%;
  height:30px;
  margin-top:11px;
  color:var(--text);
  font-size:11px;
  font-weight:900;
  outline:none;
  padding:0;
  appearance:none;
  cursor:pointer
}
.search-field select option {
  color:#102f41;
  background:#fff
}
.search-field input {
  cursor:default;
  font-family:var(--font)
}
.search-field input::-webkit-calendar-picker-indicator {
  opacity:.5;
  cursor:pointer
}
.swap-button {
  border:0;
  background:var(--soft-teal);
  color:var(--primary-deep);
  width:34px;
  height:38px;
  border-radius:10px;
  display:grid;
  place-items:center;
  margin-bottom:11px;
  transition:transform .25s
}
.swap-button:hover {
  transform:rotate(180deg)
}
.search-submit {
  height:60px;
  padding:10px 13px;
  width:100%;
  font-size:12px
}
.metrics-strip {
  background:var(--surface);
  border-block:1px solid var(--border)
}
.metrics-inner {
  display:flex;
  align-items:center;
  justify-content:space-around;
  min-height:107px
}
.metrics-inner>div {
  display:flex;
  flex-direction:column;
  text-align:center
}
.metrics-inner strong {
  font-size:27px;
  color:var(--dark-deep);
  line-height:1.4;
  font-weight:900
}
[data-theme=dark] .metrics-inner strong {
  color:var(--text)
}
.metrics-inner span:not(.metrics-divider) {
  font-size:11px;
  color:var(--muted);
  font-weight:700
}
.metrics-divider {
  background:var(--border);
  height:36px;
  width:1px
}
/* Sections */
.section-title-row {
  display:flex;
  justify-content:space-between;
  gap:25px;
  align-items:end;
  margin-bottom:28px
}
.section h2,.section-title-row h2,.section-centered h2 {
  font-size:clamp(25px,3vw,36px);
  letter-spacing:-.6px;
  margin:12px 0 6px
}
.section h2 span,.section-centered h2 span,.page-title span,.banner-heading h1 span,.booking-title-row h1 span,.success-card h1 span,.tracking-title h1 span {
  color:var(--primary)
}
.section-title-row p,.section-centered p {
  font-size:12px
}
.text-link {
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--primary-deep);
  font-weight:900;
  font-size:12px;
  white-space:nowrap
}
.text-link svg {
  transition:transform .25s
}
.text-link:hover svg {
  transform:translateX(-5px)
}
.destination-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}
.destination-card {
  border:0;
  padding:0;
  text-align:right;
  position:relative;
  display:block;
  border-radius:19px;
  overflow:hidden;
  aspect-ratio:.87;
  box-shadow:var(--shadow);
  transition:transform .35s ease,box-shadow .35s ease
}
.destination-card:hover {
  transform:translateY(-7px);
  box-shadow:var(--shadow-md)
}
.destination-card img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .55s
}
.destination-card:hover img {
  transform:scale(1.09)
}
.destination-overlay {
  position:absolute;
  inset:0;
  padding:20px;
  display:flex;

  color:var(--primary);
  transform:scale(1.06)
}
.seat-btn small {
  position:absolute;
  bottom:1px;
  left:4px;
  font-size:8px;
  font-family:var(--font)
}
.seat-btn.selected {
  background:var(--primary);
  border-color:var(--primary);
  color:#fff
}
.seat-btn.busy {
  background:#e2e9eb;
  border-color:#d9e1e3;
  color:#aab9be;
  cursor:not-allowed;
  opacity:.7
}
[data-theme=dark] .seat-btn.busy {
  background:#304755
}
.seat-legend {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  flex-wrap:wrap;
  border-top:1px solid var(--border);
  padding-top:18px;
  margin-top:14px
}
.seat-legend>span {
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--muted);
  font-size:10px
}
.seat-legend i {
  width:13px;
  height:13px;
  border-radius:4px;
  background:var(--surface);
  border:1px solid #b5ced2
}
.seat-legend .legend-selected {
  background:var(--primary);
  border-color:var(--primary)
}
.seat-legend .legend-busy {
  background:#c5d1d5
}
.seat-hint-card {
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px
}
.hint-icon {
  width:50px;
  height:50px;
  display:grid;
  place-items:center;
  background:var(--soft-teal);
  color:var(--primary);
  border-radius:15px;
  margin-bottom:13px
}
.seat-hint-card h3 {
  font-size:16px;
  margin:0 0 5px
}
.seat-hint-card p {
  font-size:11px;
  line-height:2
}
.seat-counter {
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid var(--border);
  padding-top:17px;
  font-size:11px
}
.seat-counter strong {
  color:var(--primary);
  font-size:16px
}
.seat-selection-tags {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:14px
}
.seat-selection-tags>span:not(.muted) {
  background:var(--soft-teal);
  color:var(--primary-deep);
  font-weight:800;
  padding:5px 10px;
  border-radius:7px;
  font-size:10px
}
.soft-info {
  display:flex;
  align-items:flex-start;
  gap:9px;
  color:var(--primary-deep);
  background:var(--soft-teal);
  padding:13px;
  border-radius:12px;
  font-size:10px;
  font-weight:700;
  line-height:1.9;
  margin-top:14px
}
.soft-info svg {
  flex-shrink:0;
  margin-top:1px
}
.booking-controls {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  border-top:1px solid var(--border);
  margin-top:27px;
  padding-top:22px
}
.summary-card {
  padding:23px;
  position:sticky;
  top:110px
}
.summary-title {
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--primary);
  border-bottom:1px solid var(--border);
  padding-bottom:17px
}
.summary-title h3 {
  font-size:16px;
  color:var(--text);
  margin:0
}
.summary-company {
  margin:21px 0
}
.summary-company small {
  display:block;
  color:var(--muted);
  font-size:10px
}
.summary-route {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--surface-alt);
  padding:13px;
  border-radius:12px
}
.summary-route>div {
  display:flex;
  flex-direction:column;
  align-items:start
}
.summary-route small,.summary-route span:not(.summary-arrow) {
  font-size:10px;
  color:var(--muted)
}
.summary-route b {
  font-size:14px
}
.summary-arrow {
  color:var(--primary)
}
.summary-details {
  display:flex;
  flex-direction:column;
  gap:17px;
  margin:23px 0
}
.summary-details>div,.summary-total {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px
}
.summary-details span {
  font-size:11px;
  color:var(--muted)
}
.summary-details strong {
  font-size:11px;
  text-align:left
}
.summary-total {
  padding:20px 0 8px;
  border-top:1px dashed var(--border)
}
.summary-total span {
  font-size:12px;
  font-weight:800
}
.summary-total b {
  font-size:20px;
  color:var(--primary)
}
.summary-trust {
  display:flex;
  gap:7px;
  font-size:10px;
  background:var(--surface-alt);
  border-radius:10px;
  padding:9px;
  margin:12px 0 0
}
.summary-trust svg {
  flex-shrink:0;
  color:var(--primary)
}
.passenger-card {
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px;
  margin-bottom:17px
}
.passenger-heading {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:17px
}
.passenger-index {
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--soft-teal);
  color:var(--primary);
  font-weight:900
}
.passenger-heading small {
  margin-right:auto;
  background:var(--surface-alt);
  color:var(--muted);
  padding:5px 9px;
  border-radius:8px
}
.input-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}
.form-group {
  display:block;
  min-width:0
}
.form-group>span {
  display:block;
  font-weight:800;
  font-size:11px;
  margin-bottom:8px
}
.form-group em {
  color:#d86161;
  font-style:normal
}
.field-control {
  height:50px;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--border);
  border-radius:11px;
  padding:0 13px;
  color:var(--muted);
  transition:.2s
}
.field-control:focus-within {
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(16,169,154,.09)
}
.field-control input {
  border:0;
  outline:0;
  min-width:0;
  flex:1;
  width:100%;
  background:transparent;
  color:var(--text);
  font-size:12px
}
.field-control input::placeholder {
  color:#a5b4bc
}
.review-panel {
  border:1px solid var(--border);
  padding:22px;
  border-radius:17px;
  margin-bottom:18px
}
.review-panel>h3 {
  font-size:14px;
  margin:0 0 14px
}
.review-passenger {
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 0;
  border-top:1px solid var(--border)
}
.review-avatar {
  display:grid;
  place-items:center;
  width:39px;
  height:39px;
  background:var(--soft-teal);
  border-radius:50%;
  color:var(--primary)
}
.review-passenger>div {
  display:flex;
  flex-direction:column
}
.review-passenger b {
  font-size:12px
}
.review-passenger>div span {
  font-size:11px;
  color:var(--muted)
}
.review-passenger small {
  margin-right:auto;
  color:var(--primary);
  font-weight:800
}
.payment-choice {
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  cursor:pointer;
  margin-bottom:9px
}
.payment-choice:has(input:checked) {
  border-color:var(--primary);
  background:var(--soft-teal)
}
.payment-icon {
  display:grid;
  place-items:center;
  width:43px;
  height:43px;
  border-radius:11px;
  background:var(--surface-alt);
  color:var(--primary)
}
.payment-choice>span:last-child {
  display:flex;
  flex-direction:column;
  flex:1
}
.payment-choice b {
  font-size:12px
}
.payment-choice small {
  font-size:10px;
  color:var(--muted)
}
.review-alert {
  font-size:11px;
  display:flex;
  gap:9px;
  align-items:center;
  color:var(--primary-deep)
}
/* My trips */
.trips-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:23px
}
.trips-top h2 {
  font-size:19px;
  margin:0
}
.trips-top p {
  font-size:11px;
  margin:0
}
.my-trips-list {
  display:flex;
  flex-direction:column;
  gap:16px
}
.my-trip-card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:19px;
  overflow:hidden
}
.mytrip-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:var(--surface-alt);
  border-bottom:1px dashed var(--border);
  padding:19px 25px
}
.mytrip-head-main {
  display:flex;
  align-items:center;
  gap:10px
}
.mytrip-head-main>div {
  display:flex;
  flex-direction:column
}
.mytrip-head-main b {
  font-size:13px
}
.ticket-icon {
  background:var(--soft-teal);
  color:var(--primary);
  width:41px;
  height:41px;
  border-radius:12px;
  display:grid;
  place-items:center
}
.tag-success {
  background:var(--soft-teal);
  color:var(--primary-deep)
}
.tag-demo {
  background:#fff2da;
  color:#a16c21
}
.mytrip-center {
  display:grid;
  grid-template-columns:1.1fr 1fr;
  gap:25px;
  align-items:center;
  padding:30px 25px
}
.mytrip-route {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}
.mytrip-route>div:not(.mytrip-route-graphic) {
  display:flex;
  flex-direction:column
}
.mytrip-route small {
  font-size:10px;
  color:var(--muted)
}
.mytrip-route h3 {
  font-size:21px;
  margin:2px 0
}
.mytrip-route b {
  font-size:12px
}
.mytrip-route-graphic {
  display:flex;
  flex:1;
  align-items:center;
  flex-direction:column;
  color:var(--primary);
  gap:6px
}
.mytrip-route-graphic div {
  border-top:1px dashed var(--border);
  width:100%
}
.mytrip-route-graphic small {
  font-size:9px;
  white-space:nowrap
}
.mytrip-detail {
  display:flex;
  flex-direction:column;
  gap:9px;
  border-right:1px solid var(--border);
  padding-right:26px
}
.mytrip-detail>span {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  font-weight:700;
  color:var(--muted)
}
.mytrip-actions {
  display:flex;
  gap:9px;
  border-top:1px solid var(--border);
  padding:16px 25px
}
.mytrip-actions .btn {
  min-height:39px;
  font-size:11px
}
.soft-notice {
  display:flex;
  align-items:center;
  gap:9px;
  background:var(--soft-teal);
  color:var(--primary-deep);
  font-size:11px;
  padding:14px;
  border-radius:12px;
  margin-top:18px
}
/* Tracking */
.tracking-main {
  padding-bottom:60px;
  background:var(--bg)
}
.tracking-title {
  padding-top:29px;
  padding-bottom:25px;
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px
}
.tracking-title .breadcrumb {
  margin-bottom:17px
}
.tracking-title h1 {
  font-size:29px;
  margin:10px 0 0;
  display:flex;
  align-items:center;
  gap:17px;
  flex-wrap:wrap
}
.tracking-title p {
  font-size:12px;
  margin:5px 0 0
}
.tracking-live {
  font-size:10px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid #a0e6c7;
  border-radius:50px;
  color:#10a578;
  background:#e8fff4;
  padding:6px 11px;
  letter-spacing:0
}
.tracking-layout {
  display:grid;
  grid-template-columns:349px minmax(0,1fr);
  gap:18px;
  align-items:stretch
}
.tracking-sidebar {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:19px;
  padding:22px
}
.tracking-status {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:#10966f;
  font-weight:800
}
.tracking-status small {
  margin-right:auto;
  color:var(--muted);
  font-weight:700;
  direction:ltr
}
.status-dot {
  width:9px;
  height:9px;
  border-radius:50%;
  background:#13b98d;
  box-shadow:0 0 0 4px #e3f7ee;
  animation:pulse 2s ease-in-out infinite
}
.track-route-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:25px 0
}
.track-route-heading small {
  color:var(--muted);
  font-size:11px
}
.track-route-heading h2 {
  font-size:22px;
  margin:2px 0
}
.track-route-heading>span {
  color:var(--primary)
}
.track-company {
  display:flex;
  align-items:center;
  gap:9px
}
.track-company>div {
  display:flex;
  flex-direction:column
}
.track-company b {
  font-size:12px
}
.track-company small {
  font-size:10px;
  color:var(--muted)
}
.track-divider {
  border-top:1px dashed var(--border);
  margin:22px 0
}
.track-progress-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}
.track-progress-head h3 {
  font-size:13px;
  margin:0
}
.track-progress-head strong {
  color:var(--primary);
  font-size:13px
}
.progress-bar {
  height:9px;
  background:var(--surface-alt);
  border-radius:20px;
  overflow:hidden
}
.progress-bar span {
  display:block;
  height:100%;
  background:linear-gradient(90deg,#0cb5a3,#69d1b2);
  border-radius:20px;
  transition:width .2s
}
.track-timeline {
  margin:25px 0 18px;
  position:relative
}
.track-timeline:before {
  content:"";
  position:absolute;
  top:15px;
  bottom:26px;
  right:15px;
  border-right:2px dashed #cce1de
}
.timeline-stop {
  display:flex;
  gap:12px;
  align-items:start;
  position:relative;
  margin-bottom:29px
}
.timeline-stop:last-child {
  margin-bottom:0
}
.stop-indicator {
  position:relative;
  z-index:2;
  width:31px;
  height:31px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--primary);
  color:white;
  flex:0 0 31px;
  border:3px solid var(--surface)
}
.stop-indicator.last {
  background:var(--surface-alt);
  color:var(--muted);
  border-color:var(--surface)
}
.timeline-stop>div {
  display:flex;
  flex-direction:column
}
.timeline-stop b {
  font-size:12px
}
.timeline-stop small {
  font-size:10px;
  color:var(--muted)
}
.timeline-stop time {
  font-size:10px;
  color:var(--muted);
  margin-right:auto;
  white-space:nowrap
}
.timeline-stop.active time {
  color:var(--primary);
  font-weight:900
}
.track-quick-stats {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}
.track-quick-stats>div {
  padding:13px;
  border:1px solid var(--border);
  border-radius:11px;
  display:flex;
  flex-direction:column
}
.track-quick-stats span {
  display:flex;
  gap:6px;
  align-items:center;
  color:var(--muted);
  font-size:10px
}
.track-quick-stats b {
  font-size:16px;
  margin-top:5px
}
.track-controls {
  display:flex;
  gap:9px;
  margin-top:18px
}
.track-controls .btn-primary {
  flex:1
}
.track-controls .small-square {
  width:49px;
  padding:0
}
.tracking-warning {
  display:flex;
  gap:7px;
  align-items:flex-start;
  margin:17px 0 0;
  font-size:10px;
  line-height:1.85
}
.tracking-warning svg {
  flex:none
}
.tracking-map-panel {
  min-width:0;
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:19px;
  background:#e5f0eb;
  min-height:650px
}
.map-toolbar {
  position:absolute;
  z-index:4;
  top:17px;
  right:17px;
  left:17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  pointer-events:none
}
.map-toolbar>div {
  background:#fff;
  border:1px solid rgba(10,60,70,.1);
  border-radius:11px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:9px;
  box-shadow:0 8px 22px rgba(15,64,75,.07);
  font-size:11px;
  font-weight:800;
  color:#224457
}
.map-toolbar .map-toggle {
  font-size:10px
}
.map-toolbar .map-toggle span {
  display:flex;
  align-items:center;
  gap:5px
}
.live-map,.fallback-map {
  position:absolute;
  inset:0;
  width:100%;
  height:100%
}
.live-map {
  display:none;
  z-index:1;
  direction:ltr
}
.fallback-map {
  display:block;
  z-index:1
}
.syria-schematic {
  width:100%;
  height:100%;
  object-fit:cover
}
.map-bottom-overlay {
  position:absolute;
  bottom:17px;
  right:17px;
  left:17px;
  z-index:3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
  pointer-events:none
}
.map-bottom-overlay>span {
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#fff;
  border-radius:9px;
  padding:8px 12px;
  color:#1d4a56;
  font-size:10px;
  font-weight:800;
  box-shadow:0 6px 20px rgba(0,0,0,.05)
}
.map-bottom-overlay .map-caption {
  font-size:9px;
  font-weight:700;
  color:#83989f
}
.map-caption-dot {
  color:var(--primary)
}
.map-bus-icon {
  width:42px;
  height:42px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#fff;
  color:#0ca99c;
  box-shadow:0 5px 18px rgba(10,70,74,.25);
  border:3px solid #10b49d
}
/* Auth */
.auth-main {
  background:var(--bg);
  padding:54px 0 78px
}
.auth-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:25px;
  min-height:610px;
  overflow:hidden;
  box-shadow:var(--shadow)
}
.auth-panel {
  padding:49px min(6vw,80px);
  display:flex;
  flex-direction:column;
  justify-content:center
}
.auth-top h1 {
  font-size:30px;
  margin:12px 0 5px;
  letter-spacing:-.7px
}
.auth-top h1 span {
  color:var(--primary)
}
.auth-top p {
  font-size:12px
}
.auth-form {
  display:flex;
  flex-direction:column;
  gap:17px;
  margin:25px 0 15px
}
.auth-form .form-group>span {
  font-size:12px
}
.auth-form .field-control {
  height:55px
}
.auth-form .field-control input {
  font-size:12px
}
.show-password {
  background:none;
  border:0;
  color:var(--muted);
  display:grid;
  place-items:center;
  padding:5px
}
.auth-helper {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:11px
}
.auth-helper a,.auth-switch a {
  color:var(--primary);
  font-weight:900
}
.terms-check {
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:11px
}
.auth-submit {
  margin-top:3px;
  min-height:53px
}
.auth-switch {
  text-align:center;
  font-size:11px;
  color:var(--muted);
  margin:12px 0 15px
}
.auth-demo-note {
  background:var(--surface-alt);
  border-radius:10px;
  display:flex;
  align-items:start;
  gap:8px;
  padding:13px;
  font-size:10px;
  color:var(--muted)
}
.auth-demo-note svg {
  flex:none;
  color:var(--primary)
}
.auth-visual {
  background:linear-gradient(165deg,#123e51 0%,#1b7176 100%);
  padding:42px 35px;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  color:#fff
}
.auth-visual:before {
  content:"";
  width:440px;
  height:440px;
  position:absolute;
  right:-210px;
  top:-170px;
  border:1px dashed rgba(255,255,255,.18);

.toast {
  position:fixed;
  left:24px;
  bottom:24px;
  z-index:300;
  display:flex;
  align-items:center;
  gap:10px;
  max-width:calc(100% - 48px);
  padding:14px 19px;

  box-shadow:0 20px 45px rgba(0,0,0,.18);
  font-size:12px;
  font-weight:800;
  opacity:0;
  transform:translateY(16px);
  transition:opacity .25s,transform .25s;
  pointer-events:none
}

  transform:translateY(0)
}

/* Motion */
@keyframes float {
  0%,100% {
    transform:translate3d(0,0,0) rotate(1.5deg)
  }
  50% {
    transform:translate3d(0,var(--float-distance),0) rotate(1.5deg)
  }
}
@keyframes pulse {
  0%,100% {
    box-shadow:0 0 0 4px rgba(16,186,137,.14)
  }
  50% {
    box-shadow:0 0 0 9px rgba(16,186,137,0)
  }
}
@keyframes pop {
  0% {
    transform:scale(.55);
    opacity:0
  }
  75% {
    transform:scale(1.08)
  }
  100% {
    transform:scale(1);
    opacity:1
  }
}
@keyframes fade {
  from {
    opacity:0
  }
  to {
    opacity:1
  }
}
@media(prefers-reduced-motion:reduce) {
  html {
    scroll-behavior:auto
  }
  *,*:before,*:after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important
  }
  .floating-stat {
    animation:none!important;
    transform:rotate(1.5deg)
  }
}

  // OpenFreeMap + MapLibre GL: no direct requests to the public OSM raster tile server.
  // The route is only a straight-line educational visualization, not road navigation.
  function mapCoordinates(city){ return [city.lng, city.lat]; }
  function mapFallback(id, origin, destination) {
    const el=document.getElementById(id);
    if(!el || !el.isConnected)return;
    const key=id==='home-route-map'?'miniMap':'map';
    const previous=state[key];state[key]=null;
    if(previous){try{previous.remove()}catch(err){console.warn('Map cleanup',err)}}
    if(key==='map')state.marker=null;
    const centerLat=(origin.lat+destination.lat)/2;
    const centerLng=(origin.lng+destination.lng)/2;
    // An embedded real Google Map is the no-key fallback, not a fake SVG basemap.
    const query=encodeURIComponent(centerLat.toFixed(5)+','+centerLng.toFixed(5));
    const url='https://maps.google.com/maps?q='+query+'&z=7&output=embed';
    const link=googleDirectionsLink(origin,destination);
    el.innerHTML=`<iframe class="map-google-embed" title="Google Maps - ${escapeHTML(origin.name)} إلى ${escapeHTML(destination.name)}" loading="eager" referrerpolicy="no-referrer-when-downgrade" src="${url}"></iframe><a class="map-open-directions" href="${link}" rel="noopener noreferrer" target="_blank">فتح المسار في Google Maps ↗</a>`;
  }
  function mapErrorState(id, origin, destination) {
    // Never display provider error tiles or technical error pages on the site.
    mapFallback(id, origin, destination);

  function startInteractiveMap(containerId, origin, destination, {preview=false}={}) {
    const el=document.getElementById(containerId);
    if(!el || !window.maplibregl || !maplibregl.supported())return null;
    const sourceId='sairna-trip';
    const route={type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[mapCoordinates(origin),mapCoordinates(destination)]}};
    const map=new maplibregl.Map({
      container:el,
      style:'https://tiles.openfreemap.org/styles/liberty',
      center:[(origin.lng+destination.lng)/2,(origin.lat+destination.lat)/2],
      zoom:6,
      attributionControl:false,
      scrollZoom:!preview,
      dragRotate:false,
      pitchWithRotate:false,
      touchPitch:false,
      cooperativeGestures:false,
      fadeDuration:0
    });
    map.addControl(new maplibregl.AttributionControl({compact:preview}),'bottom-left');
    if(preview){map.scrollZoom.disable();map.dragPan.disable();map.touchZoomRotate.disable();map.doubleClickZoom.disable();map.keyboard.disable();}
    else map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
    const bounds=new maplibregl.LngLatBounds().extend(mapCoordinates(origin)).extend(mapCoordinates(destination));
    map.fitBounds(bounds,{padding:preview?38:82,maxZoom:8,duration:0});
    let ready=false, failed=false;
    const fallback=()=>{
      if(ready || failed || !el.isConnected)return;
      failed=true;
      setTimeout(()=>mapErrorState(containerId,origin,destination),0);
    };
    const watchdog=setTimeout(()=>{if(!ready)fallback();},9500);
    map.on('error', e=>{
      // A blocked style, tile, sprite or glyph must not leave error graphics visible.
      console.warn('Map provider error: falling back to Google Maps',e?.error?.message||'resource unavailable');
      if(!ready)fallback();
    });
    map.on('load',()=>{
      if(failed || !el.isConnected)return;
      try {
        map.addSource(sourceId,{type:'geojson',data:route});
        map.addLayer({id:'sairna-route-line',type:'line',source:sourceId,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#0aa99b','line-width':4,'line-opacity':.95,'line-dasharray':[2,2]}});
        [origin,destination].forEach((city,i)=>{
          new maplibregl.Marker({color:i===0?'#0aa99b':'#153c52',scale:.85})
            .setLngLat(mapCoordinates(city))
            .setPopup(new maplibregl.Popup({offset:20}).setText((i===0?'الانطلاق: ':'الوصول: ')+city.name))
            .addTo(map);
        });
        if(!preview){
          const point=document.createElement('div');point.className='sairna-moving-bus';
          const p=Number.isFinite(state.progress)?state.progress:.48;
          state.marker=new maplibregl.Marker({element:point,anchor:'center'})
            .setLngLat([origin.lng+(destination.lng-origin.lng)*p,origin.lat+(destination.lat-origin.lat)*p])
            .setPopup(new maplibregl.Popup({offset:24}).setText('موقع تجريبي تقريبي'))
            .addTo(map);
        }
        ready=true; clearTimeout(watchdog);
        el.querySelector('.map-loading-note')?.remove();
        map.resize();
      } catch(err){console.warn('Map initialization failed',err);fallback();}
    });
    return map;
  }

  }
  function aboutPage() { return `<main class="inner-main"><section class="page-banner"><div class="container">${eyebrow('قصتنا')}<h1 class="page-title">سيرنا. <span>رحلة أبسط لكل حدا.</span></h1><p>فكرة موقع لحجز الرحلات البرية بين المحافظات السورية، انبنت كنموذج لتعليم تصميم وتطوير الويب.</p></div></section><section class="container section about-grid"><div><h2>فكرة صغيرة... تجربة كبيرة.</h2><p>بدنا تجربة واضحة للمستخدم من لحظة اختيار مدينة الانطلاق والوصول، وصولاً لمقارنة الشركات، اختيار المقاعد، تأكيد التذكرة، ومشاهدة مسار الرحلة على الخريطة.</p><p>تم تطوير هذا النموذج باستخدام HTML وCSS وJavaScript دون إطار عمل، ليكون مناسباً للتدريب والتوسع لاحقاً وربطه بواجهة API حقيقية.</p><a href="#results" class="btn btn-primary">جرّب رحلة ${icon('arrow-left',17)}</a></div><img src="${PHOTO_ASSETS.latakia}" data-photo="latakia" alt="الساحل السوري في اللاذقية" loading="lazy" decoding="async"/></section></main>`; }
  function supportPage() { return `<main class="inner-main"><section class="page-banner"><div class="container">${eyebrow('نحن معك')}<h1 class="page-title">شو حابب <span>تعرف؟</span></h1><p>أسئلة بتساعدك تستخدم نموذج سيرنا بسهولة.</p></div></section><section class="container faq-section"><div class="faq-list">${[['كيف بحجز رحلة؟','حدد المحافظة اللي رح تطلع منها والمحافظة اللي بدك توصل إلها، بعدين اختار التاريخ والشركة والموعد والمقعد، وأكّد الحجز.'],['في دفع إلكتروني حقيقي؟','لا. الموقع نموذج تدريبي، وخيارات الدفع معروضة لأغراض التصميم فقط.'],['الخريطة بتعرض مكان الباص الحقيقي؟','لا. الخريطة بتعرض مسار تقديري ومحاكاة لحركة الباص. التتبع المباشر يحتاج GPS وAPI من شركة النقل.'],['وين بلاقي حجوزاتي؟','من قائمة «حجوزاتي». الحجوزات محفوظة محلياً بنفس المتصفح لأغراض التدريب.'],['هل في حسابات حقيقية؟','التسجيل والدخول محاكاة لتجربة الواجهة، وليسا نظام مصادقة حقيقياً.']].map(([q,a])=>`<details class="faq-item"><summary>${escapeHTML(q)} ${icon('plus',18)}</summary><p>${escapeHTML(a)}</p></details>`).join('')}</div><div class="support-aside">${icon('headphones',32)}<h2>بحاجة لمساعدة؟</h2><p>هاد الموقع نموذج واجهات تعليمية، وممكن تطوّرو لاحقاً لتضيفوا نظام دعم حقيقي.</p><a href="#home" class="btn btn-primary">رجوع للرئيسية</a></div></section></main>`; }
  function toast(message,type='info') { let el=$('#toast'); if (!el) {el=document.createElement('div');el.id='toast';el.className='toast';document.body.append(el)}el.innerHTML=`${icon(type==='error'?'info':'check-circle',19)} ${escapeHTML(message)}`;el.dataset.type=type;el.classList.add('show');refreshIcons();clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3600); }
  const currentPage = () => (location.hash.split('?')[0].replace('#','')||'home');
  function render(preserve=false) {
    clearInterval(state.timer);state.timer=null;
    if(state.map){try{state.map.remove()}catch{}state.map=null;state.marker=null;}
    if(state.miniMap){try{state.miniMap.remove()}catch{}state.miniMap=null;}
    const route=currentPage();document.body.classList.toggle('no-footer',route==='tracking');document.body.classList.toggle('auth-route',['login','register'].includes(route));
    const pages={home:homePage,results:resultsPage,companies:companiesPage,booking:bookingPage,trips:tripsPage,tracking:trackingPage,success:successPage,login:()=>authPage('login'),register:()=>authPage('register'),account:accountPage,about:aboutPage,support:supportPage};
    app.innerHTML=header()+(pages[route]||homePage)()+footer();
    preparePhotos();
    refreshIcons();
    if(!preserve)window.scrollTo({top:0,behavior:'instant'});
    if(route==='home')initHomeMap();
    if(route==='tracking')initTracking();
    refreshIcons();
    state.menuOpen=false;
  }
  function nav(route) { if(currentPage()===route)render();else location.hash=route; }
  function syncSearchForm(form) { const fd=new FormData(form);if(fd.get('origin')===fd.get('destination')) {toast('اختار محافظتين مختلفتين حتى نعرض الرحلات.','error');return false;}state.search={origin:fd.get('origin'),destination:fd.get('destination'),date:fd.get('date'),people:Number(fd.get('people'))};state.company='all';state.time='all';state.sort='earliest';return true; }
  function savePassengers() {
    const cards=[...document.querySelectorAll('.passenger-card')];
    const passengers=[];
    for (const card of cards) {const name=$('input[name="name"]',card),phone=$('input[name="phone"]',card);if(!name.value.trim()||name.value.trim().length<3) {toast('أدخل اسم كل مسافر (3 أحرف على الأقل).','error');name.focus();return false;}if(!/^[+\d\s-]{9,18}$/.test(phone.value.trim())) {toast('أدخل رقم هاتف صحيح لكل مسافر.','error');phone.focus();return false;}passengers.push({name:name.value.trim(),phone:phone.value.trim()});}
    state.passengers=passengers;return true;
  }
  function confirmBooking() {
    if(!state.user){state.afterAuth='booking';toast('سجّل دخولك أولاً لإتمام الحجز.');nav('login');return;}
    const t=state.selectedTrip;
    const b={id:'SR-'+String(Date.now()).slice(-7),origin:t.origin.id,destination:t.destination.id,date:t.date,departure:t.departure,arrive:t.arrive,companyId:t.company.id,seats:[...state.selectedSeats],people:Number(state.search.people),total:t.price*Number(state.search.people),passengers:state.passengers,status:'confirmed',createdAt:new Date().toISOString()};
    state.bookings.unshift(b);save('sairna-bookings',state.bookings);state.lastBooking=b;state.trackId=b.id;nav('success');
  }
  function onClick(e) {
    const btn=e.target.closest('[data-action]'); if(!btn)return;
    const action=btn.dataset.action;
    if(action==='theme'){state.theme=state.theme==='light'?'dark':'light';save('sairna-theme',state.theme);document.documentElement.dataset.theme=state.theme;render(true);}
    if(action==='menu'){state.menuOpen=!state.menuOpen;$('.mobile-panel')?.classList.toggle('open',state.menuOpen);btn.innerHTML=icon(state.menuOpen?'x':'menu',24);refreshIcons();}
    if(action==='swap'){const f=btn.closest('form');const a=$('[name="origin"]',f),b=$('[name="destination"]',f);[a.value,b.value]=[b.value,a.value];}
    if(action==='destination'){state.search.destination=btn.dataset.dest;if(state.search.destination===state.search.origin)state.search.origin='homs';nav('results');}
    if(action==='clearfilters'){state.company='all';state.time='all';state.sort='earliest';render(true);}
    if(action==='company-routes'){state.company=btn.dataset.company;nav('results');}
    if(action==='choosecompany'){state.company=btn.dataset.company;render(true);}
    if(action==='selecttrip'){state.selectedTrip=tripSeed().find(t=>t.id===btn.dataset.id);state.selectedSeats=[];state.passengers=[];state.bookingStep='seats';nav('booking');}
    if(action==='seat'){const n=Number(btn.dataset.seat),i=state.selectedSeats.indexOf(n);if(i!==-1)state.selectedSeats.splice(i,1);else if(state.selectedSeats.length>=state.search.people){toast(`مسموح تختار ${state.search.people} مقعد فقط.`,'error');return;}else state.selectedSeats.push(n);render(true);}
    if(action==='bookingback'){state.bookingStep=state.bookingStep==='review'?'passengers':'seats';render(true);}
    if(action==='bookingnext'){
      if(state.bookingStep==='seats'){if(state.selectedSeats.length!==Number(state.search.people)){toast(`لازم تختار ${state.search.people} مقعد قبل المتابعة.`,'error');return;}state.bookingStep='passengers';render(true);}
      else if(state.bookingStep==='passengers'){if(!savePassengers())return;state.bookingStep='review';render(true);}
      else confirmBooking();
    }
    if(action==='track'){state.trackId=btn.dataset.id;state.progress=.48;state.playing=true;nav('tracking');}
    if(action==='resettrack'){state.progress=0;updateTracking();}
    if(action==='playtrack'){state.playing=!state.playing;btn.innerHTML=`${icon(state.playing?'pause':'play',17)} ${state.playing?'إيقاف الحركة':'متابعة الحركة'}`;refreshIcons();}
    if(action==='showpassword'){const input=$('#auth-password');if(input){input.type=input.type==='password'?'text':'password';btn.innerHTML=icon(input.type==='password'?'eye':'eye-off',19);refreshIcons();}}
    if(action==='logout'){state.user=null;try { localStorage.removeItem('sairna-user'); } catch {}toast('تم تسجيل الخروج من النموذج.');nav('home');}
    if(action==='ticket'){
      const b=myBookings().find(x=>x.id===btn.dataset.id);if(!b)return;
      showTicket(b);
    }
    if(action==='copy'){const id=btn.dataset.id;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(id).then(()=>toast('تم نسخ رقم الحجز.')).catch(()=>toast('رقم الحجز: '+id));}else toast('رقم الحجز: '+id);}
    if(action==='closemodal'){document.querySelector('.modal-scrim')?.remove();}
  }
  function showTicket(b) {
    const c=companies.find(c=>c.id===b.companyId)||companies[0];
    const modal=document.createElement('div');modal.className='modal-scrim';modal.innerHTML=`<div class="ticket-modal" role="dialog" aria-modal="true" aria-label="تفاصيل التذكرة"><button class="modal-close icon-button" data-action="closemodal" aria-label="إغلاق">${icon('x',22)}</button><div class="ticket-modal-head">${icon('ticket',30)}<span>تذكرتك مع سيرنا</span><strong>SAIRNA</strong></div><div class="ticket-modal-body"><div class="ticket-code"><small>رقم الحجز</small><strong dir="ltr">${escapeHTML(b.id)}</strong></div><div class="ticket-big-route"><span>${cityById(b.origin).name}</span>${icon('arrow-left',24)}<span>${cityById(b.destination).name}</span></div><div class="ticket-meta"><span>شركة النقل <b>${c.name}</b></span><span>التاريخ <b>${dateText(b.date)}</b></span><span>الموعد <b dir="ltr">${b.departure}</b></span><span>المقاعد <b>${b.seats.join('، ')}</b></span><span>الإجمالي <b>${money(b.total)}</b></span></div><p>تذكرة توضيحية — غير صالحة للسفر أو الدفع.</p><button class="btn btn-outline full" data-action="copy" data-id="${escapeHTML(b.id)}">${icon('copy',17)} نسخ رقم الحجز</button></div></div>`;document.body.append(modal);refreshIcons();modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
  }
  function onSubmit(e) {
    const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();
    if(form.dataset.form==='search'){if(syncSearchForm(form))nav('results');return;}
    if(form.dataset.form==='login'||form.dataset.form==='register'){
      const fd=new FormData(form),email=String(fd.get('email')).trim().toLowerCase(),password=String(fd.get('password'));
      if(password.length<6){toast('كلمة المرور لازم تكون 6 أحرف على الأقل.','error');return;}
      const name=form.dataset.form==='register'?String(fd.get('name')).trim():(email.split('@')[0]||'مسافر سيرنا');
      if(name.length<2){toast('أدخل اسماً صحيحاً.','error');return;}
      // لا يتم تخزين كلمة المرور. المصادقة شكلية للتدريب فقط.
      state.user={name,email};save('sairna-user',state.user);
      const dest=state.afterAuth||'account';state.afterAuth=null;toast('أهلاً وسهلاً! تم الدخول للعرض التجريبي.');nav(dest);
    }
  }
  function onChange(e) {
    if(e.target.matches('[name="company-filter"]')){state.company=e.target.value;render(true);}
    if(e.target.matches('[name="time-filter"]')){state.time=e.target.value;render(true);}
    if(e.target.matches('[data-filter="sort"]')){state.sort=e.target.value;render(true);}
    if(e.target.matches('[name="payment"]'))state.payment=e.target.value;
  }
  function initTracking(){
    const b=myBookings().find(t=>t.id===state.trackId)||myBookings()[0];
    const o=cityById(b.origin),d=cityById(b.destination);
    const approxDist=Math.max(75,Math.round(Math.hypot((o.lat-d.lat)*110,(o.lng-d.lng)*88)*1.20));
    const dist=document.getElementById('track-distance');if(dist)dist.textContent=`~${approxDist} كم`;
    state.progress=Number.isFinite(state.progress)?state.progress:.48;
    state.playing=true;
    initTrackingMap(); updateTracking();
    state.timer=setInterval(()=>{if(!state.playing||currentPage()!=='tracking')return;state.progress=state.progress>=1?0:Math.min(1,state.progress+.006);updateTracking();},150);
  }
  function updateTracking(){
    const p=state.progress||0;
    if($('#progress-label'))$('#progress-label').textContent=Math.round(p*100)+'%';
    if($('#progress-fill'))$('#progress-fill').style.width=(p*100)+'%';
    if($('#track-eta'))$('#track-eta').textContent=p>=1?'تم الوصول':`${Math.max(1,Math.ceil((1-p)*5.4))} ساعات تقريباً`;
    if($('#current-status'))$('#current-status').textContent=p>=1?'وصلت الحافلة إلى الوجهة':p>.8?'اقتربنا من محطة الوصول':'الحافلة تتحرك نحو الوجهة';
    if(state.marker){const booking=myBookings().find(t=>t.id===state.trackId)||myBookings()[0];const o=cityById(booking.origin),d=cityById(booking.destination);state.marker.setLngLat([o.lng+(d.lng-o.lng)*p,o.lat+(d.lat-o.lat)*p]);}
  }
    document.addEventListener('click',onClick);document.addEventListener('submit',onSubmit);document.addEventListener('change',onChange);
  window.addEventListener('hashchange',()=>render());window.addEventListener('keydown',e=>{if(e.key==='Escape')$('.modal-scrim')?.remove()});
  if(!location.hash)history.replaceState(null,'','#home');render();
})();


  </script>
</body>
</html>
